name: verify-windows

on:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build WorkSummarizer.sln
        run: dotnet build src/WorkSummarizer/WorkSummarizer.sln -c Release
      - name: Build Graph.sln
        run: dotnet build src/Graph.sln -c Release
      - name: Build and test TeamFoundationServerDataSourceTests
        run: dotnet test test/TeamFoundationServerDataSourceTests/TeamFoundationServerDataSourceTests.csproj -c Release --logger "console;verbosity=normal"
